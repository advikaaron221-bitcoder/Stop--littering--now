<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litter Report App</title>
    <!-- Tailwind CSS CDN for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter for a clean look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for the body and fonts */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light blue-gray background */
        }
        /* Custom styling for focus states to match theme */
        input:focus, textarea:focus, button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5); /* Blue glow */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl border border-gray-200">
        <!-- Main heading -->
        <h1 class="text-4xl font-bold text-center mb-6 text-green-700">Litter Reporting Tool</h1>


        <!-- Introductory message from the original code -->
        <p class="text-lg text-gray-700 mb-6 text-center">
            We need to stop littering on the streets, sidewalks, and especially oceans. When we litter, it causes problems for animals that particularly live underwater.
        </p>
        <hr class="border-gray-300 mb-8">


        <!-- Form for reporting litter -->
        <form id="litterReportForm" class="space-y-6">
            <div>
                <label for="location" class="block text-gray-800 text-lg font-medium mb-2">Location of Litter:</label>
                <input type="text" id="location" name="location" placeholder="e.g., Main Street Park, Intersection of Oak & Elm"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-lg" required>
            </div>


            <div>
                <label for="description" class="block text-gray-800 text-lg font-medium mb-2">Description of Litter:</label>
                <textarea id="description" name="description" rows="4" placeholder="e.g., Plastic bottles near the bench, old tires in the alley"
                          class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 text-lg" required></textarea>
            </div>


            <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105 text-xl">
                Report Litter
            </button>
        </form>


        <!-- Message box for displaying confirmation or errors -->
        <div id="messageBox" class="mt-8 p-4 rounded-lg text-center hidden">
            <!-- Message content will be injected here by JavaScript -->
        </div>
    </div>


    <script>
        // Get references to DOM elements
        const litterReportForm = document.getElementById('litterReportForm');
        const messageBox = document.getElementById('messageBox');


        /**
         * Displays a message to the user in the message box.
         * @param {string} message - The message to display.
         * @param {string} type - The type of message ('success', 'error', 'info').
         */
        function displayMessage(message, type) {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-blue-100', 'text-blue-800');
            messageBox.classList.add('block'); // Ensure it's visible


            // Apply styling based on message type
            if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-800');
            } else { // Default to info
                messageBox.classList.add('bg-blue-100', 'text-blue-800');
            }


            // Hide the message after a few seconds
            setTimeout(() => {
                messageBox.classList.add('hidden');
                messageBox.classList.remove('block');
            }, 5000); // Message disappears after 5 seconds
        }


        /**
         * Handles the form submission event.
         * @param {Event} event - The form submission event.
         */
        litterReportForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission (page reload)


            // Get form values
            const location = document.getElementById('location').value;
            const description = document.getElementById('description').value;


            // Basic validation
            if (!location || !description) {
                displayMessage('Please fill in both the location and description fields.', 'error');
                return; // Stop function execution if validation fails
            }


            // Simulate sending data (in a real app, this would be an API call)
            console.log('Litter Report Submitted:');
            console.log('Location:', location);
            console.log('Description:', description);


            // Display success message to the user
            displayMessage('Thank you! Your litter report has been submitted. Have a good day.', 'success');


            // Optionally, clear the form fields after submission
            litterReportForm.reset();
        });
    </script>
</body>
</html>
